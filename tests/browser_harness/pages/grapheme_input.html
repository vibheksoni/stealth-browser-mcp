<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grapheme and IME Input Fixture</title>
</head>
<body>
  <h1>Grapheme and IME Input Fixture</h1>
  <form id="grapheme-form" onsubmit="event.preventDefault();">
    <div>
      <label for="grapheme-input">Grapheme Input:</label>
      <input type="text" id="grapheme-input" name="grapheme-input" placeholder="Type graphemes here" value="">
    </div>
    <div>
      <label for="grapheme-textarea">Grapheme Textarea:</label>
      <textarea id="grapheme-textarea" name="grapheme-textarea" rows="4" cols="40"></textarea>
    </div>
  </form>
</body>
</html>
