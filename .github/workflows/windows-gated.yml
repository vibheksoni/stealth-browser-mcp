name: Windows Gated (SB-47/46)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/**
      - .github/workflows/windows-gated.yml

jobs:
  windows-gated:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            exe: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          - browser: edge
            exe: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    env:
      STEALTH_BROWSER_TESTS: '1'
      GITHUB_ARTIFACT_PATH: test-output
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium-based browser (matrix)
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            echo "Chrome is preinstalled on windows-latest"
          elif [ "${{ matrix.browser }}" = "edge" ]; then
            echo "Edge is preinstalled on windows-latest"
          fi
          # Brave via installer only if cheap/free; opt-in, not required.
          # winget install Brave.Brave
          # choco install brave

      - run: python -m pip install -U pip

      - run: pip install -e .

      - name: Ensure artifact directory exists
        shell: bash
        run: mkdir -p "$GITHUB_ARTIFACT_PATH"

      - name: Run gated tests
        shell: bash
        env:
          STEALTH_BROWSER_EXECUTABLE: ${{ matrix.exe }}
        run: |
          python -m unittest tests.test_seed_tools tests.test_session_spawn -v 2>&1 | tee "$GITHUB_ARTIFACT_PATH/gated.log"

      - name: Cookie carryover (DPAPI / App-Bound), record failure point
        continue-on-error: true
        env:
          STEALTH_BROWSER_EXECUTABLE: ${{ matrix.exe }}
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_session_spawn.TestSessionSpawnGatedRealBrowser -v > "$GITHUB_ARTIFACT_PATH/carryover.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo
              echo "## Cookie carryover failure (SB-48)"
              echo
              echo "DPAPI / App-Bound cookies did NOT carry over to the clone."
              echo "Browser: ${{ matrix.browser }}"
              echo "Where it fails (exit code ${code}):"
              echo
              echo '```'
              tail -n 200 "$GITHUB_ARTIFACT_PATH/carryover.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "## Cookie carryover (SB-48)"
              echo
              echo "DPAPI / App-Bound cookies carried over to the clone (green)."
              echo "Browser: ${{ matrix.browser }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gated-output-${{ matrix.browser }}
          path: test-output
